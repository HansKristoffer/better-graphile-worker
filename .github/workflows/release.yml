name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish again (for example v1.0.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
      # GITHUB_TOKEN cannot trigger PR CI automatically; dispatch it explicitly.
      - name: Check the release PR
        if: steps.rp.outputs.prs_created == 'true'
        uses: actions/github-script@v8
        env:
          RELEASE_PRS: ${{ steps.rp.outputs.prs }}
        with:
          script: |
            for (const pr of JSON.parse(process.env.RELEASE_PRS || '[]')) {
              const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });
              if (data.state !== 'open' || data.head.repo.full_name !== context.payload.repository.full_name) continue;
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id: 'ci.yml', ref: data.head.ref,
              });
            }

  publish:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bgw_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bgw_test
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate the release tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName
      # Keep the recovery tools from this workflow commit, even for an older tag.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Keep package verification tools
        run: |
          cp scripts/verify-package.mjs "$RUNNER_TEMP/verify-package.mjs"
          cp scripts/publish-package.mjs "$RUNNER_TEMP/publish-package.mjs"
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check package and tag versions agree
        run: node -e 'if (require("./package.json").version !== process.env.TAG.slice(1)) process.exit(1)'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - run: node "$RUNNER_TEMP/verify-package.mjs"
      - name: Publish the verified tarball
        run: node "$RUNNER_TEMP/publish-package.mjs"
