name: Dependency compatibility
on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:
jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:consumers
        env:
          PEER_PROFILE: latest
          TYPESCRIPT_VERSION: latest
